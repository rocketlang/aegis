# Publish @xshieldai/varuna to npm with provenance from the PUBLIC aegis repo (OIDC).
#   tag varuna-v<ver>  ·  packages/varuna  ·  @xshieldai/varuna
# A tag publishes; a manual run rehearses. Tag version must equal packages/varuna/package.json.
# Auth: NPM_TOKEN secret (first publish of a new name) OR a Trusted Publisher once configured.

name: Release @xshieldai/varuna

on:
  push:
    tags:
      - 'varuna-v*'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/varuna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade npm for OIDC + provenance
        run: npm install -g npm@latest && npm --version
      - name: Refuse a tag that disagrees with package.json
        if: github.ref_type == 'tag'
        run: |
          NAME=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          [ "$NAME" = "@xshieldai/varuna" ] || { echo "named $NAME — refusing"; exit 1; }
          [ "${GITHUB_REF_NAME##*-v}" = "$VER" ] || { echo "tag ${GITHUB_REF_NAME} != $VER — refusing"; exit 1; }
          echo "$NAME $VER"
      - name: Refuse if the README does not name this package
        run: head -1 README.md | grep -q '@xshieldai/varuna' || { echo "README mis-named — refusing"; exit 1; }
      - name: Install and build
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-audit --no-fund; fi
          npm run build
          test -f dist/main.js || { echo "dist/main.js missing after build — refusing"; exit 1; }
      - name: Show what would ship
        run: npm pack --dry-run
      # Staged publish: a stage-capable NPM_TOKEN submits the version to a staging area (never needs 2FA,
      # creates the new package), with provenance. A human then approves it with 2FA (npm UI / npm stage approve).
      - name: Stage publish to npm (provenance; approve with 2FA to go live)
        if: github.ref_type == 'tag'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          npm stage publish --provenance --access public
      - name: Staged — awaiting human approval
        if: github.ref_type == 'tag'
        run: echo "@xshieldai/varuna@$(node -p "require('./package.json').version") STAGED. Approve it with 2FA at npmjs.com → Staged Packages (or 'npm stage approve') to publish it with provenance."
