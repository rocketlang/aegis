name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC trusted publishing — no stored token
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc with a placeholder _authToken that npm would
      # use instead of the OIDC identity (a 404). Default registry + OIDC is what we want.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner's bundled npm drifts.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      # @xshieldai/aegis ships its source (files[]); publish only packs those, so there is
      # no dependency install to fail on the internal @ankr/* bricks (now optional). npm
      # authenticates via the workflow's OIDC identity — requires a Trusted Publisher on
      # npmjs.com for @xshieldai/aegis (rocketlang/aegis, release.yml, publish-directly on).
      - name: Publish to npm (OIDC trusted publishing, with provenance)
        run: npm publish --provenance --access public
