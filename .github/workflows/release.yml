# Publish @xshieldai/aegis with npm provenance.
#
# The package ships its source (files[] in package.json); there is no build step. A tag
# `v<version>` publishes. A manual run from a branch is a rehearsal: it checks and packs,
# and publishes nothing.
#
# AUTH: a Trusted Publisher on npmjs.com for @xshieldai/aegis (GitHub Actions ·
# rocketlang/aegis · release.yml · publish). No secret is stored anywhere.
#
#   git tag v<version> && git push origin v<version>

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC trusted publishing — no stored token
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc with a placeholder _authToken that npm would
      # use instead of the OIDC identity (a 404). Default registry + OIDC is what we want.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner's bundled npm drifts.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG — refusing"; exit 1
          fi
          echo "version $PKG"

      - name: Refuse if a tracked file changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the tree is not clean — refusing:"; git status --porcelain; exit 1
          fi
          echo "tree clean at $(git rev-parse HEAD)"

      # The shasum printed here is what a stranger gets from `npm pack` on a clean checkout
      # of the same commit. It is the number to compare with the registry listing.
      - name: Show what would ship
        run: npm pack --dry-run

      # @xshieldai/aegis ships its source (files[]); publish only packs those, so there is
      # no dependency install to fail on the internal @ankr/* bricks (now optional).
      # prepublishOnly runs scripts/publish-guard.mjs, which refuses outside this workflow.
      - name: Publish to npm (OIDC trusted publishing, with provenance)
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public

      - name: Confirm the attestation is actually on the registry
        if: github.ref_type == 'tag'
        run: |
          # Publishing without error is not proof the attestation landed. Ask the registry,
          # the way a consumer would. A new version can take a couple of minutes to be
          # listed: not listed yet is waited for; listed with no attestation is the alarm.
          PKG=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org/-/npm/v1/attestations/@xshieldai%2faegis@$PKG"
          for i in $(seq 1 90); do
            LISTED=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@xshieldai%2faegis/$PKG")
            if [ "$LISTED" = "200" ]; then
              # The listing and the attestation do not appear at the same instant: aegis
              # 2.3.1 was listed a moment before its attestation was served, and this step
              # raised the alarm on a version that had one. Give the attestation its own wait.
              for j in $(seq 1 18); do
                if curl -sf "$URL" | grep -q 'slsa.dev/provenance'; then
                  echo "provenance attestation present for $PKG"; exit 0
                fi
                echo "$PKG is listed; attestation not served yet, waiting"; sleep 10
              done
              echo "PUBLISHED WITHOUT PROVENANCE — $PKG has been listed for 3 minutes and the registry holds no provenance attestation for it"; exit 1
            fi
            echo "$PKG not listed yet (HTTP $LISTED), waiting"; sleep 10
          done
          echo "COULD NOT CONFIRM — $PKG was not listed after 15 minutes. This is not a finding about provenance; look at the registry by hand."; exit 1
