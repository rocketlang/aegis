# Publish one of the packages under packages/ with npm provenance.
#
# One workflow for seven packages, so the checks are written once:
#
#   tag                            package                        directory
#   aegis-guard-v<version>         @xshieldai/aegis-guard         packages/aegis-guard
#   aegis-suite-v<version>         @xshieldai/aegis-suite         packages/aegis-suite
#   chitta-detect-v<version>       @xshieldai/chitta-detect       packages/chitta-detect
#   flow-v<version>                @xshieldai/flow                packages/flow
#   hanumang-mandate-v<version>    @xshieldai/hanumang-mandate    packages/hanumang-mandate
#   lakshmanrekha-v<version>       @xshieldai/lakshmanrekha       packages/lakshmanrekha
#   n8n-nodes-kavachos-v<version>  @xshieldai/n8n-nodes-kavachos  packages/n8n-nodes-kavachos
#
# (Until 1.4.1 the n8n package was @xshieldai/n8n-nodes, tag n8n-nodes-v<version>. n8n's community-nodes
# screen only installs a name that starts with n8n-nodes- after the scope, so it was renamed at 1.5.0.)
#
# A tag publishes. A manual run (pick the package) is a rehearsal: it installs, builds,
# tests and packs, and publishes nothing.
#
# AUTH: a Trusted Publisher on npmjs.com for each package (GitHub Actions · rocketlang/aegis
# · release-package.yml · publish). No secret is used for a package that already exists.
#
# A name that is NOT on the registry yet cannot have a Trusted Publisher (the setting lives on the
# package's own page). Its first version is STAGED with the NPM_TOKEN secret (stage-capable) and goes
# live only when a person approves it with 2FA at npmjs.com → Staged Packages. After that, add the
# Trusted Publisher on the new package's page and every later release is tokenless like the others.
#
# The root package has release.yml (tag v*); the kernel has release-agent-kernel.yml.

name: Release a package

on:
  push:
    tags:
      - 'aegis-guard-v*'
      - 'aegis-suite-v*'
      - 'chitta-detect-v*'
      - 'flow-v*'
      - 'hanumang-mandate-v*'
      - 'lakshmanrekha-v*'
      - 'n8n-nodes-kavachos-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to rehearse (nothing is published from a manual run)'
        required: true
        type: choice
        options:
          - aegis-guard
          - aegis-suite
          - chitta-detect
          - flow
          - hanumang-mandate
          - lakshmanrekha
          - n8n-nodes-kavachos

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC trusted publishing and provenance — no stored token
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc with a placeholder _authToken that npm would
      # use instead of the OIDC identity.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9     # pinned: the test runner is part of what the release rests on

      # The package comes from the tag's prefix, or from the choice on a manual run. It is
      # matched against a fixed list; anything else is refused. The tag's version must
      # equal the version in the package's own package.json.
      - name: Resolve the package and refuse a tag that disagrees with it
        id: pkg
        env:
          CHOICE: ${{ inputs.package }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then KEY="${GITHUB_REF_NAME%-v*}"; else KEY="$CHOICE"; fi
          case "$KEY" in
            aegis-guard|aegis-suite|chitta-detect|flow|hanumang-mandate|lakshmanrekha|n8n-nodes-kavachos) DIR="packages/$KEY" ;;
            *) echo "no package is released under the name '$KEY' — refusing"; exit 1 ;;
          esac
          NAME=$(node -p "require('./$DIR/package.json').name")
          VERSION=$(node -p "require('./$DIR/package.json').version")
          if [ "$NAME" != "@xshieldai/$KEY" ]; then
            echo "$DIR/package.json is named $NAME, not @xshieldai/$KEY — refusing"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME##*-v}" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match $NAME $VERSION — refusing"; exit 1
          fi
          echo "$NAME $VERSION in $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Only a package with a lockfile has anything to install; only one with a build
      # script has anything to build. Install scripts of dependencies are not run.
      - name: Install from the lockfile and build, where the package has them
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else echo "no lockfile: nothing to install"; fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; else echo "no build script: the package ships its source"; fi

      - name: Run the package's tests, where it has them
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [ -d tests ]; then bun test; else echo "no tests directory in this package"; fi

      # Six packages were once released with READMEs titled for, and telling the reader to
      # install, another package name. The README is inside the tarball and is what the
      # registry page shows.
      - name: Refuse if the README does not describe this package
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: node scripts/check-readme.mjs "$DIR"

      # aegis-suite shipped for months importing its dependencies under names it did not
      # depend on, so it could not be imported at all. The repository's own tests use
      # relative imports and never saw it. This installs the packed tarball the way a
      # consumer would and imports it by its published name.
      - name: Refuse if the package cannot be imported under its own name
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          if [ "$NAME" = "@xshieldai/n8n-nodes-kavachos" ]; then
            echo "skipped for $NAME: its nodes load inside n8n, a peer dependency that is not installed here"; exit 0
          fi
          # The tarball is found by listing the directory, not by reading npm's output,
          # whose form differs between npm versions.
          mkdir "$RUNNER_TEMP/packed" "$RUNNER_TEMP/consumer"
          (cd "$DIR" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed" > /dev/null)
          TGZ=$(ls "$RUNNER_TEMP"/packed/*.tgz)
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --ignore-scripts "$TGZ"
          bun -e "const m = await import('$NAME'); console.log('$NAME imports under its own name;', Object.keys(m).length, 'exports')"
          # Bun loads TypeScript; plain Node does not. hanumang-mandate 0.3.1 shipped src/index.ts as its
          # entry and passed the Bun check above while no Node user could import it. A package whose
          # entry is JavaScript must also import under plain Node; one whose entry is TypeScript says so.
          MAIN=$(node -p "require('./node_modules/$NAME/package.json').main || ''")
          case "$MAIN" in
            *.js) node --input-type=module -e "const m = await import('$NAME'); console.log('$NAME imports under plain Node;', Object.keys(m).length, 'exports')" ;;
            *) echo "note: the entry of $NAME is $MAIN, which plain Node cannot load: it is importable under Bun only" ;;
          esac

      - name: Refuse if a tracked file changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the tree is not clean — refusing:"; git status --porcelain; exit 1
          fi
          echo "tree clean at $(git rev-parse HEAD)"

      # The shasum printed here is what a stranger gets from the same steps on a clean
      # checkout of the same commit. It is the number to compare with the registry listing.
      - name: Show what would ship
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [ -d dist ]; then find dist -type f | sort | xargs sha256sum; fi
          npm pack --dry-run

      # Is this name on the registry at all? 200 = an existing package (tokenless publish). 404 = a new
      # name (its first version is staged). Anything else is not an answer, and nothing is published.
      - name: Ask the registry whether this package exists yet
        id: exists
        if: github.ref_type == 'tag'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          ENC=$(printf '%s' "$NAME" | sed 's#/#%2f#')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$ENC")
          case "$CODE" in
            200) echo "$NAME exists on the registry: tokenless publish"; echo "new=0" >> "$GITHUB_OUTPUT" ;;
            404) echo "$NAME is a NEW name: its first version will be staged for a person to approve"; echo "new=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "the registry answered HTTP $CODE for $NAME — refusing to guess"; exit 1 ;;
          esac

      # prepublishOnly runs scripts/publish-guard.mjs, which refuses outside a tag run.
      - name: Publish to npm (OIDC trusted publishing, with provenance)
        if: github.ref_type == 'tag' && steps.exists.outputs.new == '0'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public

      # The only step that sees the token, and only for a name the registry does not hold. Staging never
      # needs 2FA and creates the package; it is not installable until a person approves it with 2FA.
      - name: Stage the first version of a new package (a person approves it with 2FA)
        if: github.ref_type == 'tag' && steps.exists.outputs.new == '1'
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NAME: ${{ steps.pkg.outputs.name }}
          PKG: ${{ steps.pkg.outputs.version }}
        run: |
          [ -n "$NPM_TOKEN" ] || { echo "a first publish needs the NPM_TOKEN secret (a stage-capable npm token) — refusing"; exit 1; }
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          npm stage publish --provenance --access public
          rm -f "$HOME/.npmrc"
          echo "$NAME@$PKG is STAGED, not published. Approve it with 2FA at npmjs.com → Staged Packages (or 'npm stage approve'). Then add a Trusted Publisher on the package's page: GitHub Actions · rocketlang/aegis · release-package.yml."

      - name: Confirm the attestation is actually on the registry
        if: github.ref_type == 'tag' && steps.exists.outputs.new == '0'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          PKG: ${{ steps.pkg.outputs.version }}
        run: |
          # Publishing without error is not proof the attestation landed. Ask the registry,
          # the way a consumer would. The listing and the attestation each take their own
          # time to appear and are waited for separately.
          ENC=$(printf '%s' "$NAME" | sed 's#/#%2f#')
          URL="https://registry.npmjs.org/-/npm/v1/attestations/$ENC@$PKG"
          for i in $(seq 1 90); do
            LISTED=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$ENC/$PKG")
            if [ "$LISTED" = "200" ]; then
              for j in $(seq 1 18); do
                if curl -sf "$URL" | grep -q 'slsa.dev/provenance'; then
                  echo "provenance attestation present for $NAME $PKG"; exit 0
                fi
                echo "$NAME $PKG is listed; attestation not served yet, waiting"; sleep 10
              done
              echo "PUBLISHED WITHOUT PROVENANCE — $NAME $PKG has been listed for 3 minutes and the registry holds no provenance attestation for it"; exit 1
            fi
            echo "$NAME $PKG not listed yet (HTTP $LISTED), waiting"; sleep 10
          done
          echo "COULD NOT CONFIRM — $NAME $PKG was not listed after 15 minutes. This is not a finding about provenance; look at the registry by hand."; exit 1
