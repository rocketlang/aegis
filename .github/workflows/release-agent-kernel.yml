# Publish @xshieldai/agent-kernel with npm provenance.
#
# WHY THIS EXISTS
#
# A consumer installing the package today cannot tell which commit built it, or that
# we built it at all. Provenance closes that: npm records a sigstore attestation
# binding the tarball to this repository, this workflow file, and the exact commit,
# and npm verifies it on install. It is the same mechanism that lets a third party
# check a signed release without asking us anything.
#
# It CANNOT be produced by publishing from a laptop. Provenance requires an OIDC
# identity that only CI has, which is the point — the attestation is worth something
# precisely because no human could have minted it by hand.
#
# AUTH — trusted publishing preferred, token as fallback:
#   Preferred: configure a Trusted Publisher on npmjs.com for @xshieldai/agent-kernel
#             (GitHub Actions · rocketlang/aegis · release-agent-kernel.yml). No secret
#             is stored anywhere, and there is no long-lived credential to leak.
#   Fallback:  set an NPM_TOKEN repository secret (automation token).
#
# Tag prefix is deliberate. `release.yml` already fires on `v*` and publishes the ROOT
# package, so a bare `v2.1.0` tag would trigger both and publish the wrong thing.
#
#   git tag agent-kernel-v2.1.0 && git push origin agent-kernel-v2.1.0

name: Release @xshieldai/agent-kernel

on:
  push:
    tags:
      - 'agent-kernel-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for provenance — without it npm publishes unattested
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NO registry-url: it makes setup-node write an .npmrc with a placeholder
          # _authToken (XXXXX-XXXXX-...), and npm then uses that bogus token instead of
          # the OIDC identity — the request goes out unauthenticated and the registry
          # answers 404. Without it, npm publishes to the default registry via OIDC.

      # Provenance needs npm >= 9.5; trusted publishing needs newer still. The runner's
      # bundled npm drifts, so pin it forward rather than inherit whatever ships.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED. The bundler is part of the build inputs, so  makes the
          # output depend on the day it ran — reproducibility would be a coincidence.
          # Bump this deliberately, and expect the artefact hash to move when you do.
          bun-version: 1.3.9

      # Deliberately NO `bun install`. The repo's root dependencies include private
      # @ankr/* packages that a public runner cannot reach, and this package does not
      # need them: the CLI's import graph contains no @ankr code and the bundle carries
      # zero references to it. Verified by building from a clean clone with no
      # node_modules at all — 30 modules, same output. Installing here would fail the
      # release on dependencies the artifact never uses.

      # The build runs the version-drift guard first: it refuses if the CLI's
      # KAVACHOS_VERSION disagrees with package.json. That mismatch shipped a CLI
      # reporting 2.0.0 for five months, so the check is part of the build, not a habit.
      - name: Build
        working-directory: packages/kavachos
        run: bun run build

      - name: Refuse to publish a tag that disagrees with package.json
        working-directory: packages/kavachos
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#agent-kernel-v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG — refusing"; exit 1
          fi
          echo "version $PKG"

      # 2.0.2 was published from a working tree with uncommitted changes: its package.json
      # is not the one at the commit it names. A build that alters a tracked file would
      # recreate that here, silently. dist/ is ignored, so a clean build leaves nothing.
      - name: Refuse if the build changed a tracked file
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the tree is not clean after the build — refusing:"; git status --porcelain; exit 1
          fi
          echo "tree clean at $(git rev-parse HEAD)"

      # The numbers a stranger needs to rebuild and compare. The same commit built offline
      # on another machine with the pinned bun gave the same tarball shasum as this runner
      # (measured on commit 0f637d7, 2026-10-04) — so these lines are checkable, not decor.
      - name: Show what would ship
        working-directory: packages/kavachos
        run: |
          sha256sum dist/*
          npm pack --dry-run

      # A manual run from a branch is a rehearsal: it builds, checks and packs, and stops
      # here. Only a tag publishes — a branch run has no version tag to be checked against,
      # and it used to fall through to publish.
      - name: Publish with provenance
        if: github.ref_type == 'tag'
        working-directory: packages/kavachos
        # Trusted Publishing (OIDC): npm authenticates via the workflow's id-token, no
        # stored secret. A publish token is deliberately NOT passed — a 2FA-bypass token is
        # staging-restricted (E_STAGE_REQUIRED) and npm is retiring it; OIDC publishes
        # directly, with the same provenance. Requires a Trusted Publisher configured on
        # npmjs.com for this package (repo rocketlang/aegis, workflow release-agent-kernel.yml).
        run: npm publish --provenance --access public

      - name: Confirm the attestation is actually on the registry
        if: github.ref_type == 'tag'
        working-directory: packages/kavachos
        run: |
          # Publishing without error is not proof the attestation landed. Ask the
          # registry, the way a consumer would.
          PKG=$(node -p "require('./package.json').version")
          sleep 15
          if npm view "@xshieldai/agent-kernel@$PKG" dist.attestations --json | grep -q provenance; then
            echo "provenance attestation present for $PKG"
          else
            echo "PUBLISHED WITHOUT PROVENANCE — investigate before announcing"; exit 1
          fi
