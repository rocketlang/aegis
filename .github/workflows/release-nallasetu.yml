# Publish @xshieldai/nallasetu to npm with provenance from the PUBLIC aegis repo (OIDC).
#   tag nallasetu-v<ver>  ·  packages/nallasetu  ·  @xshieldai/nallasetu  (Bun service; ships source)
# A tag publishes; a manual run rehearses. Tag version must equal packages/nallasetu/package.json.
# Auth: NPM_TOKEN secret (first publish of a new name) OR a Trusted Publisher once configured.

name: Release @xshieldai/nallasetu

on:
  push:
    tags:
      - 'nallasetu-v*'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/nallasetu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade npm for OIDC + provenance
        run: npm install -g npm@latest && npm --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Refuse a tag that disagrees with package.json
        if: github.ref_type == 'tag'
        run: |
          NAME=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          [ "$NAME" = "@xshieldai/nallasetu" ] || { echo "named $NAME — refusing"; exit 1; }
          [ "${GITHUB_REF_NAME##*-v}" = "$VER" ] || { echo "tag ${GITHUB_REF_NAME} != $VER — refusing"; exit 1; }
          echo "$NAME $VER"
      - name: Refuse if the README does not name this package
        run: head -1 README.md | grep -q '@xshieldai/nallasetu' || { echo "README mis-named — refusing"; exit 1; }
      - name: Install deps (frozen) where a lockfile exists
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else echo "no lockfile"; fi
      # Since 0.5.0 the server ships a Node build (dist/server.js, gitignored, built here).
      - name: Build the server for Node
        run: bun run build
      # Start the packed server under plain Node, in a throwaway HOME (its database lives under $HOME),
      # and refuse unless /health answers with this version.
      - name: Refuse if the packed server does not start under plain Node
        run: |
          mkdir "$RUNNER_TEMP/packed" "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/home"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed" > /dev/null
          cd "$RUNNER_TEMP/consumer" && npm init -y > /dev/null
          npm install --ignore-scripts "$(ls "$RUNNER_TEMP"/packed/*.tgz)"
          HOME="$RUNNER_TEMP/home" PORT=4997 node node_modules/@xshieldai/nallasetu/dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4997/health > health.json && break; sleep 1; done
          kill %1 || true
          VER=$(node -p "require('./node_modules/@xshieldai/nallasetu/package.json').version")
          node -e "const h=require('./health.json'); if (h.status!=='ok'||h.version!=='$VER') { console.error('health:', JSON.stringify(h)); process.exit(1) } console.log('nallasetu', h.version, 'starts under plain Node', process.version)" || { cat server.log; exit 1; }
      - name: Show what would ship
        run: npm pack --dry-run
      # Tokenless OIDC trusted publishing — requires a Trusted Publisher on npmjs.com for @xshieldai/nallasetu
      # (GitHub Actions · rocketlang/aegis · release-nallasetu.yml). Publishes directly with provenance, no token.
      - name: Publish to npm (OIDC trusted publishing, with provenance)
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public
